name: 🔍 PR Review

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  ratchet:
    name: 🔩 Ratchet Lint
    uses: ./.github/workflows/ratchet.yml
    secrets: inherit

  test-docs:
    name: 📙 Test docs
    uses: ./.github/workflows/test-docs.yml
    secrets: inherit

  check:
    name: ✅ Check
    if: always()
    needs:
      - ratchet
      - test-docs

    runs-on: ubuntu-latest

    steps:
      - name: Require all jobs to succeed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # ratchet:re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}